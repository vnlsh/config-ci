name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim # Вариант 8
    steps:
      - uses: actions/checkout@v4

      - name: Вывод версий Python и коммита
        run: |
          python --version
          echo "Commit: ${{ github.sha }}"

      - name: Проверка компиляции Python
        run: |
          python -m compileall .

      - name: Проверка обязательных ключей конфигурации
        run: |
          python config_check.py

  test:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim
    steps:
      - uses: actions/checkout@v4
      - name: Запуск Unit-тестов
        run: |
          python -m unittest discover -s tests -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Создание артефакта и манифеста (Вариант 8)
        run: |
          mkdir -p dist
          cp config_check.py dist/
          cp README.md dist/
          cp Dockerfile dist/
          cp config.json.example dist/
          
          echo "Commit SHA: ${{ github.sha }}" > dist/manifest.txt
          echo "Pipeline ID: ${{ github.run_id }}" >> dist/manifest.txt
          echo "Files:" >> dist/manifest.txt
          ls dist/ >> dist/manifest.txt
          
          echo "Содержимое манифеста:"
          cat dist/manifest.txt
          
      - name: Загрузка артефакта на GitHub (хранить 7 дней)
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7